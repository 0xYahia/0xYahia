<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mohamed Yahia, Full-Stack Software Engineer</title>
  <desc id="desc">Full-Stack Software Engineer at Advansys ESC working with TypeScript, Angular, React, Next.js, Node.js and NestJS. Based in Cairo, Egypt.</desc>
  <defs>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .code { font-size: 15px; }
      .kw { fill: #cf222e; } .var { fill: #8250df; } .key { fill: #0550ae; }
      .str { fill: #0a3069; } .punc { fill: #1f2328; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f8f8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7e74"/>
      <stop offset="1" stop-color="#0969da"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#07d2be" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#07d2be" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b6cff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5b6cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d0d7de"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </linearGradient>
    <mask id="dotmask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="318" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)" mask="url(#dotmask)" opacity="0.7"/>
    <circle cx="140" cy="40" r="260" fill="url(#glow1)"/>
    <circle cx="1080" cy="300" r="300" fill="url(#glow2)"/>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <!-- Left: identity -->
  <text class="mono" x="64" y="84" font-size="17" fill="#0a7e74" xml:space="preserve">~/0xYahia<tspan fill="#59636e"> $ </tspan><tspan fill="#1f2328">whoami </tspan><tspan fill="#0a7e74">▌<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  <text class="sans" x="62" y="158" font-size="62" font-weight="700" fill="#1f2328" letter-spacing="-1">Mohamed Yahia</text>
  <text class="sans" x="64" y="204" font-size="29" font-weight="600" fill="url(#accent)">Full-Stack Software Engineer</text>
  <text class="mono" x="64" y="246" font-size="16" fill="#59636e">TypeScript · Angular · React · Next.js · Node.js · NestJS</text>
  <g transform="translate(64 266)" fill="#59636e">
    <path d="M7 0C3.1 0 0 3.1 0 7c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 7 4.5a2.5 2.5 0 0 1 0 5z" transform="scale(0.85)"/>
    <text class="sans" x="20" y="14" font-size="16">Cairo, Egypt</text>
  </g>

  <!-- Right: code window -->
  <g transform="translate(668 52)">
    <rect width="472" height="216" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <path d="M0 12a12 12 0 0 1 12-12h448a12 12 0 0 1 12 12v22H0z" fill="#eaeef2"/>
    <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
    <circle cx="38" cy="17" r="5.5" fill="#febc2e"/>
    <circle cx="56" cy="17" r="5.5" fill="#28c840"/>
    <text class="mono" x="236" y="22" font-size="12.5" text-anchor="middle" fill="#59636e">about-me.ts</text>
    <text class="mono code" x="24" y="64" xml:space="preserve"><tspan class="kw">const </tspan><tspan class="var">yahia</tspan><tspan class="punc"> = {</tspan></text>
    <text class="mono code" x="24" y="87" xml:space="preserve">  <tspan class="key">role</tspan><tspan class="punc">: </tspan><tspan class="str">&quot;Full-Stack Engineer&quot;</tspan><tspan class="punc">,</tspan></text>
    <text class="mono code" x="24" y="110" xml:space="preserve">  <tspan class="key">company</tspan><tspan class="punc">: </tspan><tspan class="str">&quot;Advansys ESC&quot;</tspan><tspan class="punc">,</tspan></text>
    <text class="mono code" x="24" y="133" xml:space="preserve">  <tspan class="key">frontend</tspan><tspan class="punc">: [</tspan><tspan class="str">&quot;Angular&quot;</tspan><tspan class="punc">, </tspan><tspan class="str">&quot;React&quot;</tspan><tspan class="punc">, </tspan><tspan class="str">&quot;Next.js&quot;</tspan><tspan class="punc">],</tspan></text>
    <text class="mono code" x="24" y="156" xml:space="preserve">  <tspan class="key">backend</tspan><tspan class="punc">: [</tspan><tspan class="str">&quot;Node.js&quot;</tspan><tspan class="punc">, </tspan><tspan class="str">&quot;NestJS&quot;</tspan><tspan class="punc">],</tspan></text>
    <text class="mono code" x="24" y="179" xml:space="preserve">  <tspan class="key">basedIn</tspan><tspan class="punc">: </tspan><tspan class="str">&quot;Cairo, Egypt&quot;</tspan><tspan class="punc">,</tspan></text>
    <text class="mono code" x="24" y="202" xml:space="preserve"><tspan class="punc">};</tspan></text>
  </g>
</svg>
