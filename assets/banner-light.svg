<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mohamed Yahia, Senior Software Engineer</title>
  <desc id="desc">Senior Software Engineer focused on backend development with Java, Spring Boot, C# and .NET, with frontend experience in Angular, React and TypeScript, plus Docker, Kubernetes, AWS and Linux. Currently at NTG Clarity in Cairo, Egypt.</desc>
  <defs>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .code { font-size: 14px; }
      .ann { fill: #8250df; } .kw { fill: #cf222e; } .type { fill: #953800; }
      .field { fill: #0550ae; } .str { fill: #0a3069; } .punc { fill: #1f2328; } .cls { fill: #8250df; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f8f8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a7e74"/>
      <stop offset="1" stop-color="#0969da"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#07d2be" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#07d2be" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b6cff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5b6cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d0d7de"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </linearGradient>
    <mask id="dotmask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="318" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)" mask="url(#dotmask)" opacity="0.7"/>
    <circle cx="140" cy="40" r="260" fill="url(#glow1)"/>
    <circle cx="1080" cy="300" r="300" fill="url(#glow2)"/>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <!-- Left: identity -->
  <text class="mono" x="64" y="76" font-size="17" fill="#0a7e74" xml:space="preserve">~/0xYahia<tspan fill="#59636e"> $ </tspan><tspan fill="#1f2328">whoami </tspan><tspan fill="#0a7e74">▌<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  <text class="sans" x="62" y="146" font-size="62" font-weight="700" fill="#1f2328" letter-spacing="-1">Mohamed Yahia</text>
  <text class="sans" x="64" y="190" font-size="29" font-weight="600" fill="url(#accent)">Senior Software Engineer</text>
  <text class="mono" x="64" y="230" font-size="16" fill="#59636e" xml:space="preserve"><tspan fill="#0a7e74">Backend </tspan> · Java · Spring Boot · C# · .NET</text>
  <text class="mono" x="64" y="256" font-size="16" fill="#59636e" xml:space="preserve"><tspan fill="#0a7e74">Frontend</tspan> · Angular · React · TypeScript</text>
  <g transform="translate(64 274)" fill="#59636e">
    <path d="M7 0C3.1 0 0 3.1 0 7c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 7 4.5a2.5 2.5 0 0 1 0 5z" transform="scale(0.85)"/>
    <text class="sans" x="20" y="14" font-size="16">Cairo, Egypt · 4+ years experience</text>
  </g>

  <!-- Right: code window with Java and C# tabs -->
  <g transform="translate(652 30)">
    <rect width="500" height="260" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <path d="M0 12a12 12 0 0 1 12-12h476a12 12 0 0 1 12 12v24H0z" fill="#eaeef2"/>
    <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
    <circle cx="38" cy="18" r="5.5" fill="#febc2e"/>
    <circle cx="56" cy="18" r="5.5" fill="#28c840"/>
    <path d="M78 36V14a6 6 0 0 1 6-6h86a6 6 0 0 1 6 6v22z" fill="#f6f8fa"/>
    <text class="mono" x="127" y="27" font-size="12.5" text-anchor="middle" fill="#1f2328">Yahia.java</text>
    <text class="mono" x="218" y="27" font-size="12.5" text-anchor="middle" fill="#59636e">Yahia.cs</text>
    <text class="mono code" x="24" y="70" xml:space="preserve"><tspan class="ann">@RestController</tspan></text>
    <text class="mono code" x="24" y="91" xml:space="preserve"><tspan class="ann">@RequestMapping</tspan><tspan class="punc">(</tspan><tspan class="str">&quot;/api/v1/me&quot;</tspan><tspan class="punc">)</tspan></text>
    <text class="mono code" x="24" y="112" xml:space="preserve"><tspan class="kw">public class </tspan><tspan class="cls">Yahia</tspan><tspan class="punc"> {</tspan></text>
    <text class="mono code" x="24" y="133" xml:space="preserve">  <tspan class="type">String </tspan><tspan class="field">role</tspan><tspan class="punc"> = </tspan><tspan class="str">&quot;Senior Software Engineer&quot;</tspan><tspan class="punc">;</tspan></text>
    <text class="mono code" x="24" y="154" xml:space="preserve">  <tspan class="type">String </tspan><tspan class="field">company</tspan><tspan class="punc"> = </tspan><tspan class="str">&quot;NTG Clarity&quot;</tspan><tspan class="punc">;</tspan></text>
    <text class="mono code" x="24" y="175" xml:space="preserve">  <tspan class="type">String[] </tspan><tspan class="field">backend</tspan><tspan class="punc"> = {</tspan><tspan class="str">&quot;Spring Boot&quot;</tspan><tspan class="punc">, </tspan><tspan class="str">&quot;.NET&quot;</tspan><tspan class="punc">};</tspan></text>
    <text class="mono code" x="24" y="196" xml:space="preserve">  <tspan class="type">String[] </tspan><tspan class="field">frontend</tspan><tspan class="punc"> = {</tspan><tspan class="str">&quot;Angular&quot;</tspan><tspan class="punc">, </tspan><tspan class="str">&quot;React&quot;</tspan><tspan class="punc">};</tspan></text>
    <text class="mono code" x="24" y="217" xml:space="preserve">  <tspan class="type">String[] </tspan><tspan class="field">ops</tspan><tspan class="punc"> = {</tspan><tspan class="str">&quot;Docker&quot;</tspan><tspan class="punc">, </tspan><tspan class="str">&quot;K8s&quot;</tspan><tspan class="punc">, </tspan><tspan class="str">&quot;AWS&quot;</tspan><tspan class="punc">, </tspan><tspan class="str">&quot;Linux&quot;</tspan><tspan class="punc">};</tspan></text>
    <text class="mono code" x="24" y="238" xml:space="preserve"><tspan class="punc">}</tspan></text>
  </g>
</svg>
